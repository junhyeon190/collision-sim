<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>충돌·안전장치 시뮬레이터</title>
    <script>
      // GitHub Pages는 정적 파일 호스팅이라 /studio/3 같은 깊은 주소로 직접 들어오면 404를 띄운다.
      // 실제 경로를 쿼리스트링에 담아 index.html로 되돌려보내고, index.html에서 다시 복원한다.
      // (rafgraph/spa-github-pages의 널리 쓰이는 방식)
      var pathSegmentsToKeep = 1; // 저장소 이름 부분(/collision-sim/)은 그대로 유지
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
