<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>충돌·안전장치 시뮬레이터</title>
    <script>
      // 404.html이 쿼리스트링에 숨겨 보낸 실제 경로를 다시 주소창에 복원한다.
      // (GitHub Pages 배포가 아닐 때는 쿼리스트링이 없으므로 아무 일도 하지 않는다.)
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
